<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Apartment</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb">

    <!-- Mobile App Support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">
    <meta name="apple-mobile-web-app-title"
          content="My Apartment">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #020617 0%,
                    #07152f 50%,
                    #0f2a5c 100%
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        /* =========================
           APP CONTAINER
        ========================= */

        .app-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           CLICKABLE APP ICON
        ========================= */

        .app-icon {
            width: 512px;
            height: 512px;

            max-width: 85vw;
            max-height: 85vw;

            display: block;

            border-radius: 23%;

            overflow: hidden;

            text-decoration: none;

            cursor: pointer;

            background: #ffffff;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.55);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =========================
           IMAGE
        ========================= */

        .app-icon img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* =========================
           HOVER
        ========================= */

        .app-icon:hover {
            transform: scale(1.03);

            box-shadow:
                0 35px 90px
                rgba(0, 0, 0, 0.65);
        }


        /* =========================
           CLICK / TAP
        ========================= */

        .app-icon:active {
            transform: scale(0.95);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .app-icon {
                width: 85vw;
                height: 85vw;

                border-radius: 22%;
            }
        }

    </style>

</head>


<body>

    <main class="app-container">

        <!--
            CLICKABLE MY APARTMENT ICON

            Clicking this image opens app.html
        -->

        <a
            href="./app.html"
            class="app-icon"
            aria-label="Open My Apartment"
        >

            <img
                src="./My Appartment.png"
                alt="My Apartment"
            >

        </a>

    </main>


    <!-- =========================
         SERVICE WORKER
    ========================= -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(function (registration) {

                        console.log(
                            "My Apartment Service Worker registered:",
                            registration.scope
                        );

                    })
                    .catch(function (error) {

                        console.error(
                            "Service Worker registration failed:",
                            error
                        );

                    });

            });

        }

    </script>

</body>

</html>
